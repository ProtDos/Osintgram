[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "igscope"
version = "0.1.0"
description = "A minimal, importable Instagram OSINT module (a stripped-down Osintgram fork)"
readme = "igscope/README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "ProtDos" }]
keywords = ["instagram", "osint", "instagrapi", "scraping"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]
dependencies = [
    "instagrapi>=2.0",
    "geopy>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/ProtDos/Osintgram"
Repository = "https://github.com/ProtDos/Osintgram"

# Only the rundown `igscope` package is published; the original web/AI app under
# src/ is intentionally left out of the installable distribution.
[tool.setuptools]
packages = ["igscope"]

[tool.setuptools.package-data]
igscope = ["README.md", "requirements.txt"]
